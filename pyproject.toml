[project]
name = "terra-server"
version = "0.1.0"
description = "ESP32 사육장 IoT 디바이스 ↔ Supabase 백엔드 (MQTT 브리지 + REST API)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.0",
    "uvicorn>=0.44.0",
    "supabase>=2.28.3",
    "pyjwt[crypto]>=2.12.1",
    "paho-mqtt>=2.1.0",
    "python-dotenv>=1.2.2",
    "bcrypt>=4.2.1",
    "boto3>=1.43.2", # R2 (S3 호환) presigned URL 발급
    "pillow>=12.3.0",
]

[project.scripts]
# 프로세스 분리 (참조: petcam-lab 의 capture/vlm 분리 패턴)
# REST API:    `uv run uvicorn backend.main:app --host 0.0.0.0 --port 8000`
# MQTT 브리지: `uv run terra-bridge`
terra-bridge = "backend.mqtt_bridge_main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

# GME(Gecko Motion Engine) 코어 핀 — dry-run 단계에서는 서버 런타임에 설치하지 않는다.
# (torch/rfdetr ~2GB, private repo. dry-run 은 analyzer 주입 구조라 미설치로 테스트됨)
# 실제 R2 write 통합 단계에서 아래를 별도 그룹으로 활성화하고 uv.lock 을 갱신할 것.
# backend/gme/__init__.py 의 PINNED_GME_COMMIT 과 반드시 동일해야 한다.
# gme = [
#   "gecko-vision-gate @ git+https://github.com/S-Soo100/gecko-vision-gate.git@077bed1d643819055651914e2685c68e3781c584",
# ]

[tool.pytest.ini_options]
# 프로젝트 루트를 sys.path에 추가 → `from backend.xxx import ...` 가능
pythonpath = ["."]
testpaths = ["tests"]
